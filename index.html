
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE NEET Photo Solver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      margin-bottom: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      margin: 10px 0 15px;
      background: #f8fafc;
    }

    .solution {
      display: none;
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 15px;
      border-radius: 8px;
      line-height: 1.7;
    }

    .solution h3 {
      margin-top: 0;
      color: #1d4ed8;
    }

    .answer {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 JEE NEET Solver</h1>
    <p>প্রশ্নের ছবি দিন, সমাধান দেখুন</p>
  </header>

  <div class="container">

    <div class="card">
      <label>পরীক্ষা নির্বাচন করুন</label>
      <select id="exam">
        <option>JEE</option>
        <option>NEET</option>
      </select>

      <label>বিষয় নির্বাচন করুন</label>
      <select id="subject">
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Mathematics</option>
        <option>Biology</option>
      </select>

      <label>প্রশ্নের ছবি আপলোড করুন</label>
      <input type="file" id="photo" accept="image/*">

      <img id="preview" alt="আপলোড করা প্রশ্নের ছবি">

      <button id="solveBtn" disabled>ছবি আপলোড করুন</button>
    </div>

    <div class="card solution" id="solution">
      <h3>📝 সমাধান</h3>

      <p><b>প্রশ্ন:</b> একটি বস্তুর বেগ 10 m/s এবং ত্বরণ 2 m/s²। 5 সেকেন্ড পরে বেগ কত?</p>

      <p><b>সূত্র:</b></p>
      <p>v = u + at</p>

      <p><b>ধাপে ধাপে:</b></p>
      <p>v = 10 + (2 × 5)</p>
      <p>v = 10 + 10</p>

      <div class="answer">
        সঠিক উত্তর: 20 m/s
      </div>

      <p class="note">এটি একটি ডেমো সমাধান। আসল ছবির প্রশ্ন সমাধানের জন্য AI যুক্ত করতে হবে।</p>
    </div>

  </div>

  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const solveBtn = document.getElementById("solveBtn");
    const solution = document.getElementById("solution");

    photo.addEventListener("change", function() {
      const file = photo.files[0];

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        solveBtn.disabled = false;
        solveBtn.textContent = "সমাধান দেখুন";
        solution.style.display = "none";
      }
    });

    solveBtn.addEventListener("click", function() {
      solution.style.display = "block";
      solution.scrollIntoView({ behavior: "smooth" });
    });
  </script>

</body>
</html>
